name: "AI PR Review Action"
description: "Review pull requests with OpenAI and post summary + line comments."
author: "ru-mah"
branding:
  icon: "check-circle"
  color: "purple"

inputs:
  openai_api_key:
    description: "OpenAI API key."
    required: true
  github_token:
    description: "GitHub token used to read PR files and post comments."
    required: false
    default: ""
  model:
    description: "OpenAI model name. If omitted, falls back to default_model in .ai-review.yml, then gpt-5-mini."
    required: false
    default: ""
  max_output_tokens:
    description: "Max completion tokens for OpenAI output. Leave empty for no Action-level limit."
    required: false
    default: ""
  max_input_tokens:
    description: "Approximate maximum input tokens sent to OpenAI. Leave empty for no Action-level truncation."
    required: false
    default: ""
  pr_number:
    description: "PR number to review. If omitted, detected from event payload."
    required: false
    default: ""
  config_path:
    description: "Path to .ai-review.yml in the caller repository."
    required: false
    default: ".ai-review.yml"
  custom_instructions:
    description: "Additional review instructions appended to config additional_rules."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Run AI review
      shell: bash
      run: node "${{ github.action_path }}/bundle/index.js"
      working-directory: ${{ github.workspace }}
      env:
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token || github.token }}
        OPENAI_MODEL: ${{ inputs.model }}
        OPENAI_MAX_OUTPUT_TOKENS: ${{ inputs.max_output_tokens }}
        OPENAI_MAX_INPUT_TOKENS: ${{ inputs.max_input_tokens }}
        PR_NUMBER: ${{ inputs.pr_number }}
        AI_REVIEW_CONFIG_PATH: ${{ inputs.config_path }}
        AI_REVIEW_CUSTOM_INSTRUCTIONS: ${{ inputs.custom_instructions }}
